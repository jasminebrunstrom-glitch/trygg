<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trygg</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Trygg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fdf8f3">
<meta name="description" content="En spelifierad kurs för att gå från orolig till trygg anknytning.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf8f3; --card:#ffffff; --ink:#2d2230; --muted:#8a7f86; --line:#efe5dc;
  --rose:#ff6b8b; --rose-d:#d94a6b; --lav:#9b7bff; --lav-d:#7a58e0;
  --peach:#ff9f45; --peach-d:#dd7e22; --teal:#2bb3a3; --teal-d:#1a8f82; --plum:#b4479b; --plum-d:#8c3278; --wine:#d6336c; --wine-d:#a61e4d;
  --green:#58cc02; --green-d:#46a302; --red:#ff4b4b; --red-d:#d93636;
  --gold:#ffc800; --gold-d:#e0a800; --grey:#e5e0dc; --grey-d:#c9c2bc;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-weight:700;min-height:100vh;color-scheme:light}
button{font-family:inherit;cursor:pointer;border:0}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-block:0 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(253,248,243,.92);backdrop-filter:blur(10px);border-bottom:2px solid var(--line)}
.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{font-family:Fraunces,serif;font-size:22px;color:var(--rose)}
.stats{display:flex;gap:14px;font-weight:900;font-size:15px}
.stat{display:flex;align-items:center;gap:5px}
.stat.fire{color:var(--peach)} .stat.xp{color:var(--lav)} .stat.car{color:#f07a2b}

/* Hero */
.hero{margin:18px 0 8px;padding:20px;border-radius:24px;background:linear-gradient(135deg,#ffe3ea,#efe6ff);position:relative;overflow:hidden}
.hero h1{font-size:26px;line-height:1.15}
.hero p{margin:8px 0 0;color:#5d4f5a;font-weight:600;line-height:1.45}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;margin-top:12px;box-shadow:0 2px 0 var(--line)}
.lvl{margin-top:14px;height:12px;background:rgba(255,255,255,.7);border-radius:99px;overflow:hidden}
.lvl i{display:block;height:100%;background:linear-gradient(90deg,var(--rose),var(--lav));border-radius:99px;transition:width .6s}
.lvlt{font-size:12px;color:#6d5f69;margin-top:6px}

/* Units & path */
.unit{margin:26px 0 6px;border-radius:var(--radius);padding:16px 18px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.unit small{display:block;opacity:.9;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.unit h2{font-size:20px;margin-top:2px}
.unit .ub{background:rgba(255,255,255,.22);border-radius:12px;padding:8px 10px;font-size:13px;white-space:nowrap}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:22px 0 6px}
.node{position:relative;width:76px;height:72px;border-radius:50%;font-size:30px;display:grid;place-items:center;transition:transform .1s}
.node:active{transform:translateY(5px)}
.node.locked{background:var(--grey);box-shadow:0 7px 0 var(--grey-d);filter:grayscale(1);opacity:.75}
.node .ck{position:absolute;right:-4px;bottom:-4px;background:var(--gold);color:#fff;width:26px;height:26px;border-radius:50%;font-size:14px;display:grid;place-items:center;border:3px solid var(--bg)}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid currentColor;opacity:.35;animation:ring 1.6s infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.25);opacity:0}}
.tip{position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:#fff;color:var(--ink);font-size:13px;font-weight:900;padding:7px 12px;border-radius:12px;border:2px solid var(--line);white-space:nowrap;animation:bob 1.4s ease-in-out infinite;text-transform:uppercase;letter-spacing:.5px}
.tip::after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;background:#fff;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
@keyframes bob{50%{transform:translateX(-50%) translateY(-5px)}}
.nlabel{font-size:12px;color:var(--muted);text-align:center;margin-top:10px;max-width:130px;line-height:1.2}
.nwrap{display:flex;flex-direction:column;align-items:center}
.chest{font-size:34px}

/* Bottom nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:2px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;padding:10px 4px 12px;font-size:11px;color:var(--muted);font-weight:800;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
.nav button span{font-size:22px}
.nav button.on{color:var(--rose)}
.nav button.on span{transform:scale(1.12)}

/* Cards & buttons */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0}
.card h3{font-size:19px;margin-bottom:6px}
.card p{font-weight:600;line-height:1.5;color:#4d4150;margin:6px 0}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--green);box-shadow:0 5px 0 var(--green-d);transition:transform .08s}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn.rose{background:var(--rose);box-shadow:0 5px 0 var(--rose-d)}
.btn.lav{background:var(--lav);box-shadow:0 5px 0 var(--lav-d)}
.btn.ghost{background:#fff;color:var(--muted);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn:disabled{background:var(--grey);box-shadow:0 5px 0 var(--grey-d);color:#fff;cursor:default}
.sectitle{font-size:24px;margin:22px 0 4px}
.sub{color:var(--muted);font-weight:600;margin:0 0 6px;line-height:1.45}

/* Lesson overlay */
.ov{position:fixed;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column}
.ov .bar{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:14px;padding:16px}
.x{background:none;font-size:26px;color:var(--grey-d);padding:0 4px;line-height:1}
.prog{flex:1;height:16px;background:var(--grey);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.ov .body{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:6px 16px 20px}
.ov .foot{border-top:2px solid var(--line);background:#fff}
.ov .foot .in{max-width:560px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.ov .foot.good{background:#d7ffb8;border-color:#b8f28b}
.ov .foot.bad{background:#ffdfe0;border-color:#ffc1c1}
.fb{font-weight:900;font-size:18px;margin-bottom:6px}
.fb.good{color:var(--green-d)} .fb.bad{color:var(--red-d)}
.fbp{font-weight:600;line-height:1.45;margin:0 0 12px;color:#4d4150}
.kicker{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:10px 0 6px}
.q{font-family:Fraunces,serif;font-size:24px;line-height:1.2;margin:0 0 18px}
.txt{font-weight:600;font-size:17px;line-height:1.6;color:#3e3340}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:15px 16px;margin:10px 0;font-size:16px;font-weight:700;color:var(--ink);line-height:1.35}
.opt.sel{border-color:#84d8ff;background:#ddf4ff;color:#1a6a94}
.opt.right{border-color:var(--green);background:#d7ffb8}
.opt.wrong{border-color:var(--red);background:#ffdfe0}
.quote{background:linear-gradient(135deg,#fff3f6,#f4efff);border-radius:20px;padding:22px 20px;position:relative;margin:8px 0}
.quote::before{content:"”";position:absolute;top:-18px;left:14px;font-family:Fraunces,serif;font-size:80px;color:var(--rose);opacity:.35}
.quote .who{margin-top:14px;font-size:14px;color:var(--muted)}
.quote .who b{color:var(--ink)}
.study{background:#eefaf7;border:2px solid #c9eee7;border-radius:20px;padding:20px}
.study .tag{display:inline-block;background:var(--teal);color:#fff;font-size:12px;padding:4px 10px;border-radius:99px;letter-spacing:.8px;text-transform:uppercase}
.study .src{font-size:13px;color:var(--muted);margin-top:12px;font-weight:600}
.filter{margin-top:14px;background:#fff8e5;border:2px dashed #ffd66b;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;line-height:1.45;color:#6b5a2c}
.mission{background:linear-gradient(135deg,#fff1e2,#ffe5ec);border-radius:20px;padding:22px}
textarea{width:100%;min-height:140px;border:2px solid var(--line);border-radius:16px;padding:14px;font-family:inherit;font-size:16px;font-weight:600;resize:vertical;background:#fff;color:var(--ink)}
textarea:focus{outline:none;border-color:var(--lav)}
.big{font-size:64px;text-align:center;margin:18px 0 6px}
.breath{width:200px;height:200px;margin:24px auto;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd1dc,var(--rose));display:grid;place-items:center;color:#fff;font-weight:900;font-size:18px;transform:scale(.6);transition:transform 1s ease-in-out;box-shadow:0 10px 30px rgba(255,107,139,.35)}
.done-xp{display:flex;gap:12px;justify-content:center;margin:18px 0}
.pill{border-radius:16px;border:2px solid;padding:10px 16px;text-align:center;min-width:110px}
.pill small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.pill b{font-size:22px}

/* Quiz hub, carrots, journal */
.qcard{display:flex;gap:14px;align-items:center;cursor:pointer}
.qcard .ic{font-size:34px;width:60px;height:60px;border-radius:16px;display:grid;place-items:center;flex:none}
.scale{display:flex;gap:6px;margin:6px 0 14px}
.scale button{flex:1;padding:14px 0;border-radius:12px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;font-weight:900;font-size:16px;color:var(--ink)}
.scale button.sel{background:#ddf4ff;border-color:#84d8ff;color:#1a6a94}
.scale-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.meter{height:14px;background:var(--grey);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.meter i{display:block;height:100%;border-radius:99px}
.carrot{display:flex;gap:14px;align-items:flex-start}
.carrot .ic{font-size:30px;width:54px;height:54px;flex:none;border-radius:14px;display:grid;place-items:center;background:#fff1e2}
.carrot.lock{opacity:.55}
.carrot.lock .ic{background:var(--grey);filter:grayscale(1)}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=range]{width:100%;accent-color:var(--rose)}
.num{font-size:40px;font-family:Fraunces,serif;color:var(--rose);text-align:center}
.cnt{display:flex;align-items:center;justify-content:space-between;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.cnt .ctl{display:flex;align-items:center;gap:10px}
.cnt button{width:36px;height:36px;border-radius:10px;background:var(--bg);border:2px solid var(--line);font-size:20px;font-weight:900;color:var(--ink)}
.refl{border-left:4px solid var(--lav);padding:6px 12px;margin:12px 0}
.refl small{color:var(--muted);display:block;margin-bottom:4px}
.refl p{margin:0;font-weight:600;white-space:pre-wrap}
.src a{color:var(--lav-d)}
.src li{margin:8px 0;font-weight:600;line-height:1.4}
.note{font-size:13px;color:var(--muted);font-weight:600;line-height:1.5;text-align:center;margin:26px 8px}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:80;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.modal{position:fixed;inset:0;background:rgba(45,34,48,.45);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:24px 18px calc(22px + env(safe-area-inset-bottom));animation:up .3s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.hide{display:none!important}
.scene{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.sn{font-weight:600;font-size:16px;line-height:1.55;color:#5d4f5a}
.bub{max-width:82%;padding:11px 14px;border-radius:18px;font-size:16px;line-height:1.4;font-weight:700}
.bub.e{align-self:flex-end;background:var(--rose);color:#fff;border-bottom-right-radius:6px}
.bub.m{align-self:flex-start;background:#fff;border:2px solid var(--line);border-bottom-left-radius:6px}
.who{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:-6px}
.who.e{align-self:flex-end}
.th{align-self:flex-end;max-width:82%;font-style:italic;color:var(--lav-d);background:#f1ebff;border-radius:18px;padding:10px 14px;font-size:15px;font-weight:700}
.teaser li{margin:10px 0;font-weight:700;line-height:1.4}
.quick{display:flex;gap:12px;align-items:center;margin:12px 0 0;flex-wrap:wrap}
.quick .qs{flex:1;min-width:150px;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px}
.quick .qs b{font-size:20px;display:block}
.quick .qs small{color:var(--muted);font-size:12px;line-height:1.3;display:block}
.quick .btn{flex:1;min-width:150px;width:auto;font-size:14px;padding:13px 10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.pcard{position:relative;background:linear-gradient(160deg,#fff,#f4efff);border:2px solid #e3d9ff;border-bottom-width:5px;border-radius:18px;padding:14px 14px 18px;min-width:0}
.pcard small{color:var(--lav-d);font-size:11px;text-transform:uppercase;letter-spacing:.8px}
.pcard p{margin:6px 0 0;font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.pdel{position:absolute;top:8px;right:8px;background:none;color:var(--grey-d);font-size:13px;font-weight:900}
.pdel.armed{color:var(--red-d)}
.peace{margin-top:14px;border-radius:20px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--teal),#3f8fd6);box-shadow:0 5px 0 var(--teal-d)}
.peace .ph{font-weight:900;font-size:13px;text-transform:uppercase;letter-spacing:1px;opacity:.95}
.peace .pp{margin:8px 0 0;font-weight:600;font-size:14px;line-height:1.45;opacity:.95}
.pnums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px;text-align:center}
.pnums div{background:rgba(255,255,255,.18);border-radius:14px;padding:10px 4px}
.pnums b{display:block;font-family:Fraunces,serif;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.pnums small{font-size:12px;opacity:.95}
.peace input[type=date]{flex:1;min-width:0;border:0;border-radius:12px;padding:12px;font-family:inherit;font-weight:800;font-size:15px;color:var(--ink)}
.peace .row{margin-top:12px;align-items:center}
.peace .row .btn{flex:none;padding:12px 18px}
.pfight{margin-top:12px;background:rgba(255,255,255,.18);color:#fff;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13px}
.pfight[data-armed]{background:#fff;color:var(--red-d)}
.calcard{padding:16px 12px}
.calhead{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.calhead b{font-family:Fraunces,serif;font-size:20px;text-transform:capitalize}
.cnav{width:40px;height:40px;border-radius:12px;background:var(--bg);border:2px solid var(--line);font-size:22px;font-weight:900;color:var(--ink)}
.cnav:disabled{opacity:.35;cursor:default}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cwd{margin-bottom:5px}
.cwd span{text-align:center;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.cday{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;background:#fff;border:2px solid var(--line);color:var(--ink);font-weight:800;font-size:14px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums}
.cday:disabled{opacity:.35;cursor:default}
.cday.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.cday:focus-visible,.cnav:focus-visible,.seg button:focus-visible,.moods button:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.dm{display:flex;gap:2px;height:10px;align-items:center}
.mk{font-style:normal;font-size:10px;line-height:1}
.mk.mens{display:inline-block;width:7px;height:7px;border-radius:50%;background:#d7263d;box-shadow:0 0 0 1.5px #fff}
.mk.hrt{color:var(--wine-d)}
.mk.lol{color:var(--lav-d)}
.cday[style*="background"] .mk.hrt,.cday[style*="background"] .mk.lol{color:inherit}
.clegend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:14px 4px 0;font-size:12px;color:var(--muted)}
.clegend span{display:flex;align-items:center;gap:5px}
.clegend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.bigstat{display:flex;align-items:baseline;gap:10px;margin:6px 0 12px}
.bigstat b{font-family:Fraunces,serif;font-size:46px;color:var(--rose);line-height:1;font-variant-numeric:tabular-nums}
.bigstat span{font-weight:700;color:#4d4150;line-height:1.35}
.mbar{display:flex;height:16px;border-radius:99px;overflow:hidden;gap:2px;background:var(--grey)}
.mbar i{display:block;height:100%}
.mrow{display:flex;flex-wrap:wrap;gap:4px 12px;margin:8px 0 4px;font-size:13px;color:var(--muted)}
.mrow b{color:var(--ink)}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.sgrid div{background:var(--bg);border-radius:14px;padding:10px 12px}
.sgrid b{display:block;font-family:Fraunces,serif;font-size:26px;font-variant-numeric:tabular-nums}
.sgrid small{color:var(--muted);font-size:12px}
.insight{margin-top:12px;background:#f1ebff;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;line-height:1.5;color:#4b3a7a}
.dsheet{max-height:88vh;overflow-y:auto}
.moods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.moods button{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 2px;font-size:11px;font-weight:800;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px}
.moods button span{font-size:24px}
.moods button.sel{border-color:var(--mc);background:var(--mc);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.flab{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg button{background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:11px 6px;font-size:14px;font-weight:800;color:var(--ink)}
.seg2 button:last-child{grid-column:1/-1}
.seg button.sel{background:#ddf4ff;border-color:#84d8ff;color:#1a6a94}
.nav button{min-width:0;font-size:10.5px}
.syncnote{margin:10px 0 0;border-radius:14px;padding:12px 14px;font-weight:600;font-size:14px;line-height:1.45;background:#fff8e5;border:2px dashed #ffd66b;color:#6b5a2c}
.syncnote.on{background:#eefaf7;border:2px solid #c9eee7;color:#1a6a60}
.syncnote{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.syncnote>div{flex:1;min-width:180px}
.lout{background:#fff;border:2px solid currentColor;border-radius:12px;padding:8px 14px;font-weight:800;font-size:13px;color:inherit}
.login{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow-y:auto;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lcard{width:100%;max-width:400px;background:#fff;border:2px solid var(--line);border-radius:26px;padding:28px 22px;box-shadow:0 6px 0 var(--line)}
.lcard .flab{display:block}
.lin{width:100%;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-family:inherit;font-size:16px;font-weight:700;color:var(--ink);background:#fff}
.lin:focus{outline:none;border-color:var(--lav)}
.lerr{margin:12px 0 0;color:var(--red-d);font-weight:700;font-size:14px;line-height:1.4}
.lskip{display:block;width:100%;margin-top:14px;background:none;color:var(--muted);font-weight:700;font-size:13px;line-height:1.4;text-decoration:underline}
.dayp{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dayp button,.dpick{flex:1;min-width:72px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:9px 6px;font-weight:800;font-size:13px;color:var(--ink);text-align:center;position:relative;cursor:pointer}
.dayp button.sel,.dpick.sel{background:#ddf4ff;border-color:#84d8ff;color:#1a6a94}
.dpick input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.dpick:focus-within{outline:3px solid var(--lav);outline-offset:2px}
.backlog{margin:0 0 10px;background:#fff8e5;border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px;color:#6b5a2c}
.yday{display:block;width:100%;margin-top:10px;background:none;color:var(--lav-d);font-weight:800;font-size:14px;text-align:left;padding:4px 2px}
.locked .top,.locked .nav,.locked #view{display:none!important}
.gate{position:fixed;inset:0;z-index:95;overflow-y:auto;overflow-x:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;padding-block:max(28px,env(safe-area-inset-top,0px)) max(28px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
.b1{width:340px;height:340px;background:#ffb3c4;top:-90px;left:-110px}
.b2{width:380px;height:380px;background:#cbb8ff;bottom:-130px;right:-120px;animation-delay:-6s}
.b3{width:220px;height:220px;background:#ffd8a8;top:42%;left:58%;animation-delay:-12s;opacity:.45}
@keyframes drift{to{transform:translate(40px,30px) scale(1.08)}}
.gin{position:relative;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gicon{width:92px;height:92px;border-radius:26px;background:linear-gradient(140deg,#ff6b8b,#9b7bff);box-shadow:0 14px 30px rgba(155,123,255,.35);display:flex;align-items:center;justify-content:center;gap:2px;animation:floaty 5s ease-in-out infinite}
.gicon span{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:58px;line-height:1;color:#fff;margin-top:-6px}
.gicon i{width:24px;height:22px;color:#ffc800;margin-top:22px;display:block}
.gicon i svg{width:100%;height:100%;display:block}
@keyframes floaty{50%{transform:translateY(-6px)}}
.gtitle{font-family:Fraunces,Georgia,serif;font-size:56px;line-height:1;color:var(--rose);margin:22px 0 8px;letter-spacing:-.5px}
.gtag{font-family:Fraunces,Georgia,serif;font-size:22px;margin:0;color:var(--ink);text-wrap:balance}
.gsub{margin:8px 0 22px;color:var(--muted);font-weight:600;line-height:1.45;max-width:30ch;text-wrap:balance}
.gcard{width:100%;text-align:left;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:2px solid rgba(255,255,255,.9);border-radius:26px;padding:22px 20px;box-shadow:0 10px 40px rgba(155,123,255,.18)}
.gcard .flab{display:block;margin-top:4px}
.gcard .flab+.lin{margin-bottom:6px}
.gload{display:flex;align-items:center;justify-content:center;gap:12px;padding:18px 0;color:var(--muted);font-weight:800}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--rose);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.gnote{margin:0;font-weight:700;line-height:1.5;color:#6b5a2c}
.gfoot{margin:18px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
@media (prefers-reduced-motion: reduce){.blob,.gicon,.spin{animation:none}}
</style>
</head>
<body>

<header class="top"><div class="in">
  <div class="brand">trygg.</div>
  <div class="stats">
    <div class="stat fire" title="Streak">🔥 <span id="sStreak">0</span></div>
    <div class="stat car" title="Morötter">🥕 <span id="sCar">0</span></div>
    <div class="stat xp" title="XP">✦ <span id="sXp">0</span></div>
    <div class="stat sync" id="sSync" title="Inloggad och synkad" hidden>☁️</div>
  </div>
</div></header>

<main class="wrap" id="view"></main>

<nav class="nav"><div class="in">
  <button data-tab="path" class="on"><span>🗺️</span>Stigen</button>
  <button data-tab="cal"><span>📅</span>Kalender</button>
  <button data-tab="quiz"><span>🔍</span>Om dig</button>
  <button data-tab="proof"><span>🃏</span>Bevis</button>
  <button data-tab="carrots"><span>🥕</span>Morötter</button>
  <button data-tab="journal"><span>📓</span>Dagbok</button>
</div></nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   INNEHÅLL — redigera fritt. Allt är skrivet med egna ord;
   idéer från böcker är sammanfattningar, inte citat.
   ========================================================= */
const CONTENT=null;
let STAGE={name:"",desc:""}, UNITS=[], ATT_Q=[], ATT_RES={}, ROLE_Q=[], ROLE_RES={}, SOURCES=[], ALL=[];
function setContent(c){ ({STAGE,UNITS,ATT_Q,ATT_RES,ROLE_Q,ROLE_RES,SOURCES}=c); ALL=UNITS.flatMap(u=>u.lessons.map(l=>({...l, unit:u}))) }

/* =========================================================
   STATE
   ========================================================= */
const KEY="trygg_v1";
const DEF = () => ({xp:0, done:{}, carrots:{}, refl:{}, checkins:{}, days:[], att:null, role:null, proof:[], peace:null, cal:{}, calXp:{}});
const S = Object.assign(DEF(), load());
function load(){ try{ return JSON.parse(localStorage.getItem(KEY))||{} }catch(e){ return {} } }
function save(){ S._at=Date.now(); try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){} renderStats(); queuePush() }

/* ---------- Inloggning och synk (Supabase) ----------
   Klistra in dina egna värden från Supabase:
   Project Settings → API (eller Data API) → Project URL och anon/publishable key.
   Nyckeln är gjord för att vara publik; tabellens regler skyddar datan. */
const SUPABASE_URL = "https://mccpfpdbssxfqtzdkfky.supabase.co";
const SUPABASE_KEY = "sb_publishable_--N4APXY96nACamA6LSKwA_dKVEQ9Ii";

const SYNC={sb:null, uid:null, email:"", on:false, err:false, busy:false, again:false, t:null};
function hasProgress(o){ return !!(o.xp || Object.keys(o.done||{}).length || Object.keys(o.cal||{}).length || (o.proof||[]).length || Object.keys(o.checkins||{}).length || Object.keys(o.refl||{}).length) }
function localAt(){ return S._at || (hasProgress(S)?1:0) }
function queuePush(){ if(!SYNC.on) return; clearTimeout(SYNC.t); SYNC.t=setTimeout(push,800) }
async function push(){
  if(!SYNC.on) return;
  if(SYNC.busy){ SYNC.again=true; return }
  SYNC.busy=true; clearTimeout(SYNC.t); SYNC.t=null;
  try{ const {error}=await SYNC.sb.from("progress").upsert({user_id:SYNC.uid, state:S, at:localAt()}); if(error) throw error; SYNC.err=false }
  catch(e){ SYNC.err=true }
  SYNC.busy=false; syncBadge();
  if(SYNC.again){ SYNC.again=false; push() }
}
async function pull(){
  const {data,error}=await SYNC.sb.from("progress").select("state,at").eq("user_id",SYNC.uid).maybeSingle();
  if(error) throw error; return data;
}
function adopt(r){
  Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, DEF(), r.state||{});
  try{ localStorage.setItem(KEY, JSON.stringify(S)) }catch(e){}
  render();
}
function withTimeout(p,ms){ return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),ms))]) }
function syncBadge(){ const el=document.getElementById("sSync"); if(el) el.hidden=!(SYNC.on&&!SYNC.err) }
async function startSync(session){
  SYNC.uid=session.user.id; SYNC.email=session.user.email||"";
  try{
    const r=await withTimeout(pull(),10000); SYNC.on=true;
    if(r){ const ra=Number(r.at)||0, la=localAt(); if(ra>la) adopt(r); else if(la>ra) await push() }
    else if(localAt()>0) await push();
  }catch(e){ SYNC.on=false; SYNC.err=true }
  syncBadge(); render();
}
async function initSync(){
  if(!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return;
  try{
    SYNC.sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data}=await SYNC.sb.auth.getSession();
    if(data && data.session) startSync(data.session);
  }catch(e){}
}

/* ---------- Startsida och spärr (används när kursinnehållet ligger i Supabase) ---------- */
const HEART='<svg viewBox="0 0 32 29" aria-hidden="true"><path d="M16 28.5C9 23 1 17.3 1 9.6 1 4.8 4.7 1 9.3 1c2.8 0 5.2 1.4 6.7 3.6C17.5 2.4 19.9 1 22.7 1 27.3 1 31 4.8 31 9.6c0 7.7-8 13.4-15 18.9Z" fill="currentColor"/></svg>';
function showLanding(state, msg){
  let g=document.getElementById("gate");
  if(!g){
    g=document.createElement("div"); g.id="gate"; g.className="gate";
    g.innerHTML=`<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
      <main class="gin">
        <div class="gicon" aria-hidden="true"><span>t</span><i>${HEART}</i></div>
        <h1 class="gtitle">trygg.</h1>
        <p class="gtag">Från orolig till trygg.</p>
        <p class="gsub">Lugn, lekfull och säker i kärleken, ett litet steg om dagen.</p>
        <div class="gcard" id="gCard"></div>
        <p class="gfoot">🔒 Privat. Bara du kan logga in.</p>
      </main>`;
    document.body.appendChild(g);
  }
  const card=g.querySelector("#gCard");
  if(state==="loading"){ card.innerHTML=`<div class="gload"><span class="spin"></span>Öppnar din kurs…</div>`; return }
  if(state==="setup"){ card.innerHTML=`<p class="gnote">Sidan är inte kopplad till inloggningen än. Lägg in Supabase-uppgifterna i index.html.</p>`; return }
  card.innerHTML=`<form id="lForm" novalidate>
    <label class="flab" for="lEmail">E-post</label>
    <input class="lin" id="lEmail" type="email" autocomplete="username" inputmode="email" required>
    <label class="flab" for="lPw">Lösenord</label>
    <input class="lin" id="lPw" type="password" autocomplete="current-password" required>
    <p class="lerr" id="lErr" ${msg?"":"hidden"}>${esc(msg||"")}</p>
    <button class="btn rose" id="lGo" type="submit" style="margin-top:16px">Logga in</button>
  </form>`;
  $("#lForm").onsubmit=async ev=>{
    ev.preventDefault();
    const email=$("#lEmail").value.trim(), pw=$("#lPw").value, err=$("#lErr"), go=$("#lGo");
    if(!email||!pw){ err.textContent="Fyll i både e-post och lösenord."; err.hidden=false; return }
    go.disabled=true; go.textContent="Loggar in…"; err.hidden=true;
    try{
      const {data,error}=await SYNC.sb.auth.signInWithPassword({email, password:pw});
      if(error) throw error;
      unlock(data.session);
    }catch(e){
      err.textContent=(e&&/invalid/i.test(e.message||""))?"Fel e-post eller lösenord.":"Det gick inte att logga in just nu. Kolla internet och försök igen.";
      err.hidden=false; go.disabled=false; go.textContent="Logga in";
    }
  };
}
async function gate(){
  document.body.classList.add("locked");
  showLanding("loading");
  if(!SUPABASE_URL || !SUPABASE_KEY || !window.supabase) return showLanding("setup");
  try{
    SYNC.sb=window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const {data}=await withTimeout(SYNC.sb.auth.getSession(),10000);
    if(data && data.session) return unlock(data.session);
  }catch(e){}
  showLanding("form");
}
async function unlock(session){
  showLanding("loading");
  try{
    const {data,error}=await withTimeout(SYNC.sb.from("course").select("data").eq("id","main").maybeSingle(),10000);
    if(error) throw error;
    if(!data || !data.data){ try{ await SYNC.sb.auth.signOut() }catch(e){} return showLanding("form","Det här kontot har inte tillgång till kursen.") }
    setContent(data.data);
  }catch(e){ return showLanding("form","Kunde inte hämta kursen just nu. Kolla internet och försök igen.") }
  document.body.classList.remove("locked");
  const g=document.getElementById("gate"); if(g) g.remove();
  await startSync(session);
}
async function logout(){
  try{ await SYNC.sb.auth.signOut() }catch(e){}
  SYNC.on=false; SYNC.uid=null; SYNC.email="";
  try{ localStorage.removeItem(KEY) }catch(e){}
  Object.keys(S).forEach(k=>delete S[k]); Object.assign(S, DEF());
  syncBadge();
  if(!CONTENT){ setContent({STAGE:{name:"",desc:""},UNITS:[],ATT_Q:[],ATT_RES:{},ROLE_Q:[],ROLE_RES:{},SOURCES:[]}); $("#view").innerHTML=""; document.body.classList.add("locked"); tab="path"; document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x.dataset.tab==="path")); showLanding("form") }
  else render();
}
function accountCard(){
  if(!SYNC.sb || !SYNC.uid) return `<div class="syncnote">📱 Dina framsteg sparas bara på den här enheten.</div>`;
  const out=`<button class="lout" id="aOut">Logga ut</button>`;
  if(SYNC.on && !SYNC.err) return `<div class="syncnote on"><div>☁️ Inloggad som <b>${esc(SYNC.email)}</b>. Dina framsteg synkas mellan dator och mobil, och bara du kommer åt dem.</div>${out}</div>`;
  return `<div class="syncnote"><div>⚠️ Inloggad som <b>${esc(SYNC.email)}</b>, men synken svarar inte just nu. Det du gör sparas på enheten och synkas när det går igen.</div>${out}</div>`;
}
function bindAccount(){
  const o=$("#aOut"); if(o) o.onclick=()=>{ if(!o.dataset.armed){ o.dataset.armed=1; o.textContent="Säker? Tryck igen"; return } logout() };
}
document.addEventListener("visibilitychange", async ()=>{
  if(!SYNC.uid) return;
  if(document.visibilityState==="hidden"){ if(SYNC.on && SYNC.t) push(); return }
  if(document.querySelector(".ov,.modal,#gate")) return;
  if(!SYNC.on){ return startSync({user:{id:SYNC.uid, email:SYNC.email}}) }
  try{ const r=await withTimeout(pull(),10000); if(r && (Number(r.at)||0)>localAt()) adopt(r) }catch(e){}
});
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function markDay(){ const t=today(); if(!S.days.includes(t)) S.days.push(t) }
function streak(){
  let n=0; const d=new Date();
  if(!S.days.includes(fmt(d))) d.setDate(d.getDate()-1);
  while(S.days.includes(fmt(d))){ n++; d.setDate(d.getDate()-1) }
  return n;
}
function cleanStreak(){
  let n=0; const d=new Date(); const ok=k=>S.checkins[k]&&S.checkins[k].clean===true;
  if(!ok(fmt(d))) d.setDate(d.getDate()-1);
  while(ok(fmt(d))){ n++; d.setDate(d.getDate()-1) }
  return n;
}
function catchImpulse(){ const t=today(); S.checkins[t]=Object.assign({},S.checkins[t]); S.checkins[t].uf=(S.checkins[t].uf||0)+1; S.xp+=3; markDay(); save(); toast("🎣","Snyggt fångat! Du kände impulsen och lät bli. +3 XP"); render() }
function pd(k){ const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d) }
function daysSince(k){ return Math.round((pd(today())-pd(k))/86400000) }
function monthsSince(k){ const a=pd(k), b=pd(today()); let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth(); if(b.getDate()<a.getDate()) m--; return Math.max(0,m) }
const PEACE_MS=[[7,"En hel vecka",20],[14,"Två veckor",30],[30,"En månad",50],[60,"Två månader",75],[90,"Tre månader",100],[180,"Ett halvår",150],[365,"Ett helt år",300]];
function peaceCheck(){
  const P=S.peace; if(!P) return; const n=daysSince(P.start); P.ms=P.ms||{};
  if(n>(P.best||0)) P.best=n;
  let got=0, top="";
  for(const [d,name,xp] of PEACE_MS){ const key=P.start+":"+d; if(n>=d&&!P.ms[key]){ P.ms[key]=1; got+=xp; top=name } }
  if(got){ S.xp+=got; save(); setTimeout(()=>{ toast("🕊️",top+" utan bråk! +"+got+" XP"); confetti() },300) }
}
function peaceCard(){
  const P=S.peace;
  if(!P) return `<div class="peace"><div class="ph">🕊️ Bråkfri streak</div><p class="pp">Räkna dagar, veckor och månader utan bråk. Vilket datum var ert senaste bråk? Välj idag om du vill börja räkna nu.</p><div class="row"><input type="date" id="pStart" value="${today()}" max="${today()}"><button class="btn lav" id="pGo" style="width:auto">Starta</button></div></div>`;
  const n=daysSince(P.start), w=Math.floor(n/7), r=n%7, mo=monthsSince(P.start);
  const next=PEACE_MS.find(m=>m[0]>n);
  return `<div class="peace"><div class="ph">🕊️ Bråkfri streak</div>
    <div class="pnums"><div><b>${n}</b><small>${n===1?"dag":"dagar"}</small></div><div><b>${w}</b><small>${w===1?"vecka":"veckor"}${r?" + "+r+" d":""}</small></div><div><b>${mo}</b><small>${mo===1?"månad":"månader"}</small></div></div>
    ${next?`<div class="meter" style="background:rgba(255,255,255,.25)"><i style="width:${Math.min(100,n/next[0]*100)}%;background:#fff"></i></div><p class="pp">${next[0]-n} dagar kvar till ”${next[1]}” · Rekord: ${P.best||n} dagar</p>`:`<p class="pp">Rekord: ${P.best||n} dagar</p>`}
    <button class="pfight" id="pFight">Vi bråkade</button></div>`;
}
function peaceBind(){
  const g=$("#pGo"); if(g) g.onclick=()=>{ const v=$("#pStart").value||today(); S.peace={start:v>today()?today():v,best:0,fights:[],ms:{}}; markDay(); save(); render() };
  const f=$("#pFight"); if(f) f.onclick=()=>{
    if(!f.dataset.armed){ f.dataset.armed=1; f.textContent="Säker? Tryck igen för att nollställa"; return }
    const P=S.peace; P.best=Math.max(P.best||0,daysSince(P.start)); P.fights=(P.fights||[]).concat(today()); P.start=today(); save();
    toast("🤍","Räknaren börjar om. Ett bråk är inget misslyckande – det som räknas är hur ni reparerar. Gå till lektionen ”Bråka rätt” om du vill ha stöd.");
    render() };
}
function fmt(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function isUnlocked(id){ const i=ALL.findIndex(l=>l.id===id); return ALL.slice(0,i).every(l=>S.done[l.id]) }
function unitDone(u){ return u.lessons.every(l=>S.done[l.id]) }
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = s => document.querySelector(s);

function renderStats(){
  $("#sStreak").textContent=streak();
  $("#sXp").textContent=S.xp;
  $("#sCar").textContent=Object.keys(S.carrots).length;
}

/* =========================================================
   VIEWS
   ========================================================= */
let tab="path";
document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>{ if(b.dataset.tab!=="journal"||tab!=="journal") jDay=b.dataset.jump||null; delete b.dataset.jump; tab=b.dataset.tab; document.querySelectorAll(".nav button").forEach(x=>x.classList.toggle("on",x===b)); render(); scrollTo(0,0) });

function render(){ peaceCheck(); ({path:viewPath, cal:viewCal, quiz:viewQuiz, proof:viewProof, carrots:viewCarrots, journal:viewJournal})[tab](); renderStats() }

function viewPath(){
  const doneN = ALL.filter(l=>S.done[l.id]).length;
  const level = Math.floor(S.xp/100)+1, into=S.xp%100;
  let h=`<section class="hero">
    <h1>Från orolig<br>till trygg</h1>
    <p>Fem veckor med Ella och Max, ${ALL.length} lektioner och bossnivåer. Målet: så trygg och avslappnad att den som sitter bredvid dig känner sig som efter två martinis.</p>
    <div class="chip">💞 ${esc(STAGE.name)}</div>
    <div class="lvl"><i style="width:${into}%"></i></div>
    <div class="lvlt">Nivå ${level} · ${into}/100 XP · ${doneN}/${ALL.length} lektioner klara</div>
  </section>
  <div class="quick"><div class="qs"><b>🛡️ ${cleanStreak()}</b><small>dagar utan fiskefrågor, tester och jämförelser</small></div><button class="btn lav" id="catch">🎣 Fångade en impuls +3</button></div>${S.checkins[dayOffset(1)]&&S.checkins[dayOffset(1)].clean!==undefined?"":`<button class="yday" id="yday">Glömde du igår? Fyll i 🛡️ för igår →</button>`}${peaceCard()}`;
  const offs=[0,48,70,48,0,-48,-70,-48];
  let k=0, firstOpen=ALL.find(l=>!S.done[l.id]);

function chart(){
  const pts=[]; const d=new Date(); d.setDate(d.getDate()-13);
  for(let i=0;i<14;i++){ const k=fmt(d); pts.push([d.getDate(), S.checkins[k]&&S.checkins[k].saved&&S.checkins[k].a!=null?S.checkins[k].a:null]); d.setDate(d.getDate()+1) }
  if(!pts.some(p=>p[1]!==null)) return `<p>Checka in några dagar så ser du din kurva här.</p>`;
  const W=320,H=140,px=i=>16+i*(W-32)/13,py=v=>H-22-(v-1)*(H-40)/9;
  let path="",dots="";
  pts.forEach((p,i)=>{ if(p[1]===null) return; path+=(path?"L":"M")+px(i)+","+py(p[1]); dots+=`<circle cx="${px(i)}" cy="${py(p[1])}" r="4.5" fill="var(--rose)"/><text x="${px(i)}" y="${py(p[1])-9}" font-size="10" text-anchor="middle" fill="#8a7f86">${p[1]}</text>` });
  const lbl=pts.map((p,i)=>i%2===0?`<text x="${px(i)}" y="${H-4}" font-size="10" text-anchor="middle" fill="#b5aab1">${p[0]}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Oro per dag"><line x1="16" x2="${W-16}" y1="${py(5)}" y2="${py(5)}" stroke="#efe5dc" stroke-dasharray="4"/><path d="${path}" fill="none" stroke="var(--rose)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${lbl}</svg>`;
}

const MOODS=[
 {k:"great", n:"Fantastisk", e:"😍", c:"#ec4d78", t:"#fff"},
 {k:"good",  n:"Bra",        e:"🙂", c:"#f9a3b9", t:"#5a1630"},
 {k:"ok",    n:"Okej",       e:"😐", c:"#e9dfd3", t:"#5d4f5a"},
 {k:"dist",  n:"Distans",    e:"😕", c:"#b4c0dd", t:"#2f3a5c"},
 {k:"heavy", n:"Tungt",      e:"😢", c:"#7183bd", t:"#fff"}];
const MOOD=Object.fromEntries(MOODS.map(m=>[m.k,m]));
const INTIM=[["none","Inte idag"],["cuddle","Mys och närhet"],["him","Han förförde mig"],["me","Jag förförde honom"],["both","Ömsesidigt"]];
let calY=null, calM=null;
function isGood(k){ return k==="great"||k==="good" }
function lastDays(n){ const out=[]; const d=new Date(); for(let i=0;i<n;i++){ out.push(fmt(d)); d.setDate(d.getDate()-1) } return out }
function calStats(){
  const keys=lastDays(30), logged=keys.filter(k=>S.cal[k]&&S.cal[k].m);
  const good=logged.filter(k=>isGood(S.cal[k].m)).length;
  const counts=Object.fromEntries(MOODS.map(m=>[m.k,0])); logged.forEach(k=>counts[S.cal[k].m]++);
  const seen=keys.filter(k=>S.cal[k]&&S.cal[k].seen===true).length;
  const laugh=keys.filter(k=>S.cal[k]&&S.cal[k].laugh===true).length;
  let run=0; const d=new Date(); if(!(S.cal[fmt(d)]&&S.cal[fmt(d)].m)) d.setDate(d.getDate()-1);
  while(S.cal[fmt(d)]&&isGood(S.cal[fmt(d)].m)){ run++; d.setDate(d.getDate()-1) }
  const cmp=(field)=>{ const yes=logged.filter(k=>S.cal[k][field]===true), no=logged.filter(k=>S.cal[k][field]===false);
    if(yes.length<3||no.length<3) return null;
    const p=a=>Math.round(a.filter(k=>isGood(S.cal[k].m)).length/a.length*100); return [p(yes),p(no)] };
  return {logged:logged.length, good, counts, seen, laugh, run, laughCmp:cmp("laugh"), seenCmp:cmp("seen")};
}
function viewCal(){
  const now=new Date(); if(calY===null){ calY=now.getFullYear(); calM=now.getMonth() }

  let cells=""; for(let i=0;i<lead;i++) cells+=`<span></span>`;
  for(let d=1; d<=dim; d++){
    const k=fmt(new Date(calY,calM,d)), e=S.cal[k]||{}, m=e.m&&MOOD[e.m], fut=k>t;
    const st=m?`background:${m.c};color:${m.t};border-color:${m.c}`:"";
    cells+=`<button class="cday ${k===t?"today":""}" data-k="${k}" ${fut?"disabled":""} style="${st}" aria-label="${k}${m?", "+m.n:""}">
      <span class="dn">${d}</span><span class="dm">${e.mens?'<i class="mk mens"></i>':""}${e.intim==="cuddle"?'<i class="mk hrt">♡</i>':e.intim&&e.intim!=="none"?'<i class="mk hrt">♥</i>':""}${e.laugh?'<i class="mk lol">✦</i>':""}</span></button>`;
  }
  const st=calStats(), pct=st.logged?Math.round(st.good/st.logged*100):0;
  let h=`<h2 class="sectitle">Kalender</h2><p class="sub">Hur kändes relationen idag? Tryck på en dag för att logga.</p>
  <div class="card calcard">
    <div class="calhead"><button class="cnav" id="cPrev" aria-label="Föregående månad">‹</button><b>${esc(title)}</b><button class="cnav" id="cNext" ${atNow?"disabled":""} aria-label="Nästa månad">›</button></div>
    <div class="cgrid cwd">${["Mån","Tis","Ons","Tor","Fre","Lör","Sön"].map(w=>`<span>${w}</span>`).join("")}</div>
    <div class="cgrid">${cells}</div>
    <div class="clegend">${MOODS.map(m=>`<span><i style="background:${m.c}"></i>${m.n}</span>`).join("")}<span><i class="mk mens" style="position:static"></i>Mens</span><span><b style="color:var(--wine)">♡</b> Mys</span><span><b style="color:var(--wine)">♥</b> Intimitet</span><span><b style="color:var(--lav-d)">✦</b> Skratt</span></div>
    ${!(S.cal[t]&&S.cal[t].m)?`<button class="btn rose" id="cToday" style="margin-top:14px">Logga idag</button>`:""}
  </div>`;
  h+=`<div class="card"><h3>Senaste 30 dagarna</h3>`;
  if(!st.logged) h+=`<p>Logga några dagar så ser du här hur det har känts med honom.</p>`;
  else{
    h+=`<div class="bigstat"><b>${st.good}</b><span>av ${st.logged} loggade dagar har det känts bra med honom</span></div>
    <div class="mbar">${MOODS.filter(m=>st.counts[m.k]).map(m=>`<i style="flex:${st.counts[m.k]};background:${m.c}" title="${m.n}: ${st.counts[m.k]}"></i>`).join("")}</div>
    <div class="mrow">${MOODS.map(m=>`<span>${m.e} ${m.n} <b>${st.counts[m.k]}</b></span>`).join("")}</div>
    <div class="sgrid">
      <div><b>${pct}%</b><small>bra dagar</small></div>
      <div><b>${st.run}</b><small>bra dagar i rad</small></div>
      <div><b>${st.seen}</b><small>dagar ni sågs</small></div>
      <div><b>${st.laugh}</b><small>dagar ni skrattade</small></div>
    </div>`;
    const ins=[];
    if(st.laughCmp) ins.push(`Dagar ni skrattade och var lekfulla kändes bra <b>${st.laughCmp[0]}%</b> av gångerna, mot <b>${st.laughCmp[1]}%</b> andra dagar.`);

    if(ins.length) h+=`<div class="insight">💡 ${ins.join("<br>")}</div>`;

  h+=`</div><p class="note">${SYNC.on?"Allt du loggar sparas bakom din inloggning och synkas mellan dina enheter.":"Allt du loggar sparas bara på den här enheten."} Mens, mys och intimitet visas i kalendern men räknas inte i statistiken.</p>`;

  m.querySelectorAll(".seg").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ const v=b.dataset.v; e[g.dataset.f]= v==="true"?true: v==="false"?false: v; g.querySelectorAll("button").forEach(x=>x.classList.toggle("sel",x===b)) }));

function startLesson(id){
  const l=ALL.find(x=>x.id===id);
  L={l, i:0, correct:0, state:"idle", sel:null};
  const ov=document.createElement("div"); ov.className="ov"; ov.id="ov";
  ov.innerHTML=`<div class="bar"><button class="x" id="ovx" aria-label="Stäng">✕</button><div class="prog"><i id="pg"></i></div></div><div class="body" id="ob"></div><div class="foot" id="of"><div class="in" id="ofi"></div></div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden";
  $("#ovx").onclick=closeLesson;
  step();
}
function closeLesson(){ const o=$("#ov"); if(o) o.remove(); document.body.style.overflow=""; clearTimeout(breathT); L=null; render() }

let breathT=null;
function step(){
  clearTimeout(breathT);
  const s=L.l.steps[L.i], b=$("#ob"), f=$("#of"), fi=$("#ofi");
  $("#pg").style.width=(L.i/L.l.steps.length*100)+"%";
  f.className="foot"; L.state="idle"; L.sel=null; b.scrollTop=0;
  let h="", btn="Fortsätt", dis=false;
  if(s.t==="info"){ h=`<div class="kicker">💡 Lär dig</div><h2 class="q">${esc(s.h)}</h2><div class="txt">${esc(s.p)}</div>` }
  else if(s.t==="idea"){ h=`<div class="kicker">📖 Idé från boken</div><div class="quote"><div class="txt">${esc(s.p)}</div><div class="who"><b>${esc(s.who)}</b> · ${esc(s.book)}</div></div>` }
  else if(s.t==="study"){ h=`<div class="kicker">🔬 Forskningen säger</div><div class="study"><span class="tag">Studie</span><h2 class="q" style="margin-top:12px">${esc(s.h)}</h2><div class="txt">${esc(s.p)}</div><div class="src">${esc(s.src)}</div></div>` }
  else if(s.t==="check"){ h=`<div class="kicker">✏️ Testa dig</div><h2 class="q">${esc(s.q)}</h2>`+s.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join(""); btn="Kontrollera"; dis=true }
  else if(s.t==="pick"){ h=`<div class="kicker">🔍 Om dig</div><h2 class="q">${esc(s.q)}</h2>`+s.o.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o.t)}</button>`).join(""); btn="Välj"; dis=true }
  else if(s.t==="reflect"){ h=`<div class="kicker">📓 Reflektera</div><h2 class="q">${esc(s.q)}</h2><textarea id="ta" placeholder="Skriv fritt, bara du ser det…">${esc(S.refl[s.key]||"")}</textarea><p class="note" style="margin:10px 0">Sparas i din dagbok på den här enheten.</p>`; btn="Spara" }
  else if(s.t==="mission"){ h=`<div class="kicker">🎯 Dagens uppdrag</div><div class="mission"><div class="big" style="margin:0 0 10px;font-size:46px">🎯</div><div class="txt">${esc(s.p)}</div></div>`; btn="Jag tar uppdraget" }
  else if(s.t==="scene"){ let last=""; h=`<div class="kicker">📖 Story</div><h2 class="q">${esc(s.h)}</h2><div class="scene">`+s.lines.map(([k,t])=>{ let w=""; if((k==="e"||k==="m")&&k!==last) w=`<div class="who ${k}">${k==="e"?"Ella":"Max"}</div>`; last=k; return k==="n"?`<div class="sn">${esc(t)}</div>`: k==="th"?`<div class="th">💭 ${esc(t)}</div>` : w+`<div class="bub ${k}">${esc(t)}</div>` }).join("")+`</div>` }
  else if(s.t==="teaser"){ h=`<div class="kicker">🛠️ Den här veckan</div><h2 class="q">${esc(s.h)}</h2><div class="mission"><ul class="teaser" style="padding-left:20px;margin:0">${s.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div>`; btn="Kör igång" }
  else if(s.t==="breathe"){ h=`<div class="kicker">🌬️ Prova nu</div><h2 class="q">Fysiologisk suck</h2><div class="txt" style="text-align:center">Följ cirkeln: två korta inandningar genom näsan, en lång utandning genom munnen.</div><div class="breath" id="br">Redo</div>`; breathe() }
  b.innerHTML=h;
  fi.innerHTML=`<button class="btn" id="go" ${dis?"disabled":""}>${btn}</button>`;
  b.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ if(L.state!=="idle") return; b.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel")); o.classList.add("sel"); L.sel=+o.dataset.i; $("#go").disabled=false });
  $("#go").onclick=next;
}
function breathe(){
  const seq=[["In",.85,700],["In igen",1,600],["Ut…",.55,2600]]; let j=0;
  const run=()=>{ const el=$("#br"); if(!el) return; const [t,sc]=seq[j%3]; el.textContent=t; el.style.transitionDuration=(seq[j%3][2]/1000)+"s"; el.style.transform=`scale(${sc})`; j++ };
  const loop=()=>{ if(!$("#br")) return; run(); breathT=setTimeout(loop, seq[(j-1)%3][2]+200) };
  breathT=setTimeout(loop,400);
}
function next(){
  const s=L.l.steps[L.i], f=$("#of"), fi=$("#ofi");
  if(s.t==="check" && L.state==="idle"){
    const ok=L.sel===s.a; L.state="answered"; if(ok) L.correct++;
    document.querySelectorAll(".opt").forEach((o,i)=>{ if(i===s.a) o.classList.add("right"); else if(i===L.sel) o.classList.add("wrong"); o.classList.remove("sel") });
    f.className="foot "+(ok?"good":"bad");
    fi.innerHTML=`<div class="fb ${ok?"good":"bad"}">${ok?"Snyggt! 🎉":"Inte riktigt"}</div><p class="fbp">${esc(s.why)}</p><button class="btn ${ok?"":"rose"}" id="go">Fortsätt</button>`;
    $("#go").onclick=advance; return;
  }
  if(s.t==="pick" && L.state==="idle"){
    L.state="answered";
    f.className="foot good";
    fi.innerHTML=`<p class="fbp" style="font-size:16px">${esc(s.o[L.sel].r)}</p><button class="btn" id="go">Fortsätt</button>`;
    $("#go").onclick=advance; return;
  }
  if(s.t==="reflect"){ const v=$("#ta").value; S.refl[s.key]=v; save() }
  advance();
}
function advance(){ L.i++; if(L.i>=L.l.steps.length) finish(); else step() }
function finish(){
  clearTimeout(breathT);
  const first=!S.done[L.l.id]; const xp=first?(10+L.correct*5):5;
  S.done[L.l.id]=true; S.xp+=xp; markDay(); save();
  $("#pg").style.width="100%";
  $("#ob").innerHTML=`<div class="big">🌟</div><h2 class="q" style="text-align:center">Lektion klar!</h2><p class="txt" style="text-align:center">${esc(L.l.title)}</p>
   <div class="done-xp"><div class="pill" style="border-color:var(--gold);color:var(--gold-d)"><small>XP</small><b>+${xp}</b></div><div class="pill" style="border-color:var(--peach);color:var(--peach-d)"><small>Streak</small><b>🔥 ${streak()}</b></div></div>`;
  $("#of").className="foot"; $("#ofi").innerHTML=`<button class="btn" id="go">Fortsätt</button>`;
  $("#go").onclick=closeLesson; confetti();
}

/* =========================================================
   QUIZZES
   ========================================================= */
function quizShell(title){
  L={l:{steps:[]},i:0};
  const ov=document.createElement("div"); ov.className="ov"; ov.id="ov";
  ov.innerHTML=`<div class="bar"><button class="x" id="ovx">✕</button><div class="prog"><i id="pg"></i></div></div><div class="body" id="ob"></div><div class="foot" id="of"><div class="in" id="ofi"></div></div>`;
  document.body.appendChild(ov); document.body.style.overflow="hidden"; $("#ovx").onclick=closeLesson;
}
function attQuiz(){
  quizShell(); const ans=[]; let i=0;
  const show=()=>{
    $("#pg").style.width=(i/ATT_Q.length*100)+"%";
    if(i>=ATT_Q.length) return attResult(ans);
    $("#ob").innerHTML=`<div class="kicker">Påstående ${i+1} av ${ATT_Q.length}</div><h2 class="q">${esc(ATT_Q[i].t)}</h2><div class="scale">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${ans[i]===n?"sel":""}">${n}</button>`).join("")}</div><div class="scale-l"><span>Stämmer inte alls</span><span>Stämmer helt</span></div>`;
    $("#ofi").innerHTML=i>0?`<button class="btn ghost" id="bk">Tillbaka</button>`:"";
    if(i>0) $("#bk").onclick=()=>{i--;show()};
    $("#ob").querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{ ans[i]=+b.dataset.n; i++; setTimeout(show,150) });
  }; show();
}
function attResult(ans){
  const avg=d=>{ const v=ATT_Q.map((q,i)=>q.d===d?ans[i]:null).filter(x=>x!==null); return v.reduce((a,b)=>a+b,0)/v.length };
  const a=avg("a"), v=avg("v");
  const r = a>3&&v>3?"fearful": a>3?"anxious": v>3?"avoidant":"secure";
  S.att={r,a,v}; if(!S.attXp){S.xp+=15;S.attXp=1} markDay(); save();
  const R=ATT_RES[r];
  $("#ob").innerHTML=`<div class="big">${R.e}</div><h2 class="q" style="text-align:center">Du lutar åt: ${R.n}</h2><p class="txt">${R.p}</p>
    <div class="card"><p style="margin:0">Oro</p><div class="meter"><i style="width:${(a-1)/4*100}%;background:var(--rose)"></i></div><p style="margin:0">Undvikande</p><div class="meter"><i style="width:${(v-1)/4*100}%;background:var(--teal)"></i></div><p class="note" style="margin:6px 0 0;text-align:left">Inspirerat av forskningens två skalor. Ett självtest för reflektion – inte en diagnos.</p></div>`;
  $("#ofi").innerHTML=`<button class="btn" id="go">Klart</button>`; $("#go").onclick=closeLesson; confetti();
}
function roleQuiz(){
  quizShell(); const ans=[]; let i=0;
  const show=()=>{
    $("#pg").style.width=(i/ROLE_Q.length*100)+"%";
    if(i>=ROLE_Q.length) return roleResult(ans);
    const q=ROLE_Q[i];
    $("#ob").innerHTML=`<div class="kicker">Fråga ${i+1} av ${ROLE_Q.length}</div><h2 class="q">${esc(q.q)}</h2>`+q.o.map(([t,k])=>`<button class="opt" data-k="${k}">${esc(t)}</button>`).join("");
    $("#ofi").innerHTML="";
    $("#ob").querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ b.classList.add("sel"); ans[i]=b.dataset.k; i++; setTimeout(show,200) });
  }; show();
}
function roleResult(ans){
  const c={}; ans.forEach(k=>c[k]=(c[k]||0)+1);
  const r=Object.keys(c).sort((x,y)=>c[y]-c[x])[0];
  S.role=r; if(!S.roleXp){S.xp+=10;S.roleXp=1} markDay(); save();
  const R=ROLE_RES[r];
  $("#ob").innerHTML=`<div class="big">${R.e}</div><h2 class="q" style="text-align:center">Din oroliga roll: ${R.n}</h2><p class="txt">${R.p}</p><p class="note">Martyren, mamman och managern är inspirerade av Margarita Nazarenkos podcast BEING HER. Detektiven är tillagd för den som kollar och letar tecken.</p>`;
  $("#ofi").innerHTML=`<button class="btn" id="go">Klart</button>`; $("#go").onclick=closeLesson; confetti();
}

/* =========================================================
   CARROTS, TOAST, CONFETTI
   ========================================================= */
function openCarrot(u){
  const first=!S.carrots[u.id];
  if(first){ S.carrots[u.id]=true; S.xp+=20; save() }
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="sheet"><div class="big">${u.carrot.icon}</div><div class="kicker" style="text-align:center">🥕 ${first?"Ny morot upplåst! +20 XP":"Din morot"}</div><h2 class="q" style="text-align:center">${esc(u.carrot.title)}</h2><p class="txt">${esc(u.carrot.text)}</p><div class="mission" style="margin:14px 0"><div class="txt"><b>Uppdrag:</b> ${esc(u.carrot.mission)}</div></div><button class="btn" id="mc">Härligt</button></div>`;
  document.body.appendChild(m);
  m.onclick=e=>{ if(e.target===m||e.target.id==="mc"){ m.remove(); render() } };
  if(first) confetti();
}
function toast(ic,t){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="sheet" style="text-align:center"><div class="big" style="font-size:44px;margin:0">${ic}</div><p class="txt">${esc(t)}</p><button class="btn ghost">Okej</button></div>`;
  document.body.appendChild(m); m.onclick=()=>m.remove();
}
function confetti(){
  const cols=["#ff6b8b","#9b7bff","#ff9f45","#2bb3a3","#ffc800"];
  for(let i=0;i<40;i++){ const c=document.createElement("i"); c.className="confetti"; c.style.left=Math.random()*100+"vw"; c.style.background=cols[i%5]; c.style.animationDuration=(1.6+Math.random()*1.4)+"s"; c.style.animationDelay=Math.random()*.3+"s"; document.body.appendChild(c); setTimeout(()=>c.remove(),3500) }
}

if(CONTENT){ setContent(CONTENT); render(); initSync() } else { gate() }
</script>
</body>
